name: Build DNS Tile APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Generate project
        run: |
          mkdir -p proj/app/src/main/java/com/example/dnstile proj/app/src/main/res/drawable
          cd proj

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "DnsTile"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.dnstile"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.dnstile"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.WRITE_SECURE_SETTINGS" />
              <application android:label="DNS Tile">
                  <service
                      android:name=".DnsTileService"
                      android:exported="true"
                      android:label="Мой DNS"
                      android:icon="@drawable/ic_dns"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/drawable/ic_dns.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF"
                  android:pathData="M12,2L4,5v6c0,5 3.4,9.7 8,11c4.6,-1.3 8,-6 8,-11V5L12,2z"/>
          </vector>
          EOF

          cat > app/src/main/java/com/example/dnstile/DnsTileService.kt <<'EOF'
          package com.example.dnstile

          import android.provider.Settings
          import android.service.quicksettings.Tile
          import android.service.quicksettings.TileService

          class DnsTileService : TileService() {

              private val host = "dns.bezmezhau.com"

              override fun onStartListening() = refresh()

              override fun onClick() {
                  try {
                      if (isOn()) {
                          Settings.Global.putString(contentResolver, "private_dns_mode", "off")
                      } else {
                          Settings.Global.putString(contentResolver, "private_dns_specifier", host)
                          Settings.Global.putString(contentResolver, "private_dns_mode", "hostname")
                      }
                  } catch (e: SecurityException) {
                  }
                  refresh()
              }

              private fun isOn() =
                  Settings.Global.getString(contentResolver, "private_dns_mode") == "hostname" &&
                  Settings.Global.getString(contentResolver, "private_dns_specifier") == host

              private fun refresh() {
                  val tile = qsTile ?: return
                  tile.label = "Мой DNS"
                  tile.state = if (isOn()) Tile.STATE_ACTIVE else Tile.STATE_INACTIVE
                  tile.updateTile()
              }
          }
          EOF

      - name: Build
        working-directory: proj
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: dns-tile-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
          
